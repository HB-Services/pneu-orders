<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - PNEU ORDERS</title><style>body{font-family:Arial;background:#0f172a;color:#fff;padding:15px}table{width:100%;border-collapse:collapse;background:#fff;color:#000;border-radius:10px;overflow:hidden}th,td{padding:10px;border:1px solid #ddd;text-align:right;font-size:13px}th{background:#facc15}button{padding:12px;width:100%;background:#facc15;border:0;border-radius:10px;font-weight:bold;margin-bottom:10px}</style></head><body><h2 style="text-align:center">📦 طلبات PNEU ORDERS</h2><button onclick="load()">تحديث الطلبات 🔄</button><div id="box">جاري التحميل...</div><script>const URL="https://script.google.com/macros/s/AKfycbyegmQKb-cpHfKyHpT5yoHPzdKU3lyA7CnL2rPMIuew1hXTHazTOzthL1SlQNvSOWI/exec";async function load(){let r=await fetch(URL);let d=await r.json();if(!d.length){document.getElementById('box').innerHTML="ماكان حتى طلب";return}let h="<table><tr><th>التاريخ</th><th>الاسم</th><th>الهاتف</th><th>السيارة</th><th>المقاس</th><th>الماركة</th><th>الكمية</th></tr>";d.slice().reverse().forEach(o=>{h+=`<tr><td>${o.date||''}</td><td>${o.name||''}</td><td><a href="tel:${o.phone}">${o.phone||''}</a></td><td>${o.car||''}</td><td>${o.size||''}</td><td>${o.brand||''}</td><td>${o.qty||''}</td></tr>`});h+="</table>";document.getElementById('box').innerHTML=h}load();</script></body></html>
